{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">
</noscript>

<!-- favicon: images/uni.png (relative URLs so it works in local serve and production) -->
<link rel="icon" type="image/png" href="{{ '/files/images/uni.png' | relative_url }}" sizes="170x170" />
<link rel="shortcut icon" href="{{ '/files/images/uni.png' | relative_url }}" />
<link rel="apple-touch-icon" href="{{ '/files/images/uni.png' | relative_url }}" />
<link rel="manifest" href="{{ '/files/images/manifest.json' | relative_url }}" />
<meta name="theme-color" content="var(--global-bg-color)" />

<!-- Page-view counter (Abacus free hit-counter API; skipped on local dev servers) -->
<script>
    (function () {
        if (location.hostname === 'localhost' || location.hostname === '0.0.0.0' || location.hostname === '127.0.0.1') return;
        var key = location.pathname.replace(/[^a-zA-Z0-9-]/g, '') || 'home';
        fetch('https://abacus.jasoncameron.dev/hit/panyidong.github.io/' + key, { cache: 'no-store' }).catch(function () { });
    })();
</script>

<!-- end custom head snippets -->
