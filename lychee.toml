# Configuration for the lychee link checker (used by .github/workflows/check-links.yml)
# Docs: https://lychee.cli.rs/

# Network behaviour
max_retries = 3
retry_wait_time = 5
timeout = 20
max_concurrency = 8
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# 429 = rate-limited: the page exists, the host just throttled the checker
accept = ["200..=299", "429"]

# Permalinks like /publication/foo are served from foo.html
fallback_extensions = ["html"]

# Don't check email addresses
include_mail = false

exclude = [
  # Sites that block automated checkers (they return 403 even for valid pages)
  '^https?://scholar\.google\.com/',
  '^https?://(www\.)?researchgate\.net/',
  '^https?://(www\.)?linkedin\.com/',
  '^https?://(www\.)?sciencedirect\.com/',
  '^https?://(www\.)?tandfonline\.com/',
  '^https?://doi\.org/10\.1080/',          # redirects to tandfonline.com
  '^https?://papers\.ssrn\.com/',
  '^https?://asrm\.illinois\.edu/',        # Cloudflare JS challenge (cf-mitigated: challenge)
  # Not pages: font/CDN preconnect hints, page-view counter, local dev URLs
  '^https?://fonts\.(googleapis|gstatic)\.com/?$',
  '^https?://abacus\.jasoncameron\.dev/',
  '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)',
]

# Pages generated by the template that only hold third-party embeds
exclude_path = ["_site/talkmap"]
