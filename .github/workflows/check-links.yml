name: Check links

# Builds the site and checks every internal and external link.
# Runs on pushes and pull requests, plus weekly to catch links that rot over time.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # _config_docker.yml sets url: "" so internal links are root-relative
      # and get checked against this build instead of the live site.
      - name: Build site
        run: bundle exec jekyll build --config _config.yml,_config_docker.yml
        env:
          JEKYLL_ENV: production

      - name: Restore link-check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            --cache --max-cache-age 1d
            --no-progress
            '_site/**/*.html'
          fail: true
